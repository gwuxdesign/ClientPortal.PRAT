name: Unit tests

# Runs TestRunner.Web.Tests: the root cause classifier, the 799 golden cases
# that tie it to the Python, and the evidence extraction. It needs no browser
# and no access to REL, so it is safe to run on every change.
#
# The paths filter keeps it off the harness bot's data commits (those only
# touch data/harness-results.csv and the recovered text file) and off
# documentation commits.

on:
  push:
    paths:
      - 'TestRunner.Web/**'
      - 'TestRunner.Web.Tests/**'
      - 'data/root-cause-frozen-model.json'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    paths:
      - 'TestRunner.Web/**'
      - 'TestRunner.Web.Tests/**'
      - 'data/root-cause-frozen-model.json'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TestRunner.Web.Tests/TestRunner.Web.Tests.csproj

      - name: Test
        run: |
          dotnet test TestRunner.Web.Tests/TestRunner.Web.Tests.csproj \
            --no-restore \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory TestResults

      - name: Check that tests ran and summarise
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          try:
              text = open("TestResults/unit-tests.trx", encoding="utf-8-sig").read()
          except OSError:
              print("No test result file was written.", file=sys.stderr)
              sys.exit(1)
          m = re.search(r"<Counters ([^>]*)/>", text)
          c = dict(re.findall(r'(\w+)="([^"]*)"', m.group(1))) if m else {}
          total = int(c.get("total", 0))
          line = f"Unit tests: total {total}, passed {c.get('passed')}, failed {c.get('failed')}"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(line + "\n")
          sys.exit(0 if total > 0 else 1)
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: TestResults/unit-tests.trx
          retention-days: 14