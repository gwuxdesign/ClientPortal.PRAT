name: PRAT Harness (REL)

# Manual trigger only for now, while profiles are being proven out one at
# a time. Move to a schedule once Timing/Latency/Retry are all working
# reliably (see docs/harness-design.md).
#
# schedule:
#   - cron: '0 6 * * 1'  # e.g. weekly, Monday 06:00 UTC — not enabled yet

on:
  workflow_dispatch:
    inputs:
      fault_profile:
        description: 'Fault profile to run'
        required: true
        type: choice
        options:
          - Timing
          - Latency
          - Retry
          - Load
        # Concurrency is deliberately excluded until REL's security/fraud
        # monitoring owner has had a heads-up (it genuinely generates
        # parallel login traffic that could resemble credential
        # stuffing). Load doesn't need the same gate: it rewrites the
        # Documents response client-side after the real (small) response
        # is fetched, so REL sees the same request pattern as any normal
        # run — see docs/harness-design.md.
      fault_magnitude:
        description: 'Fault magnitude (profile-specific, e.g. delay in ms). A comma-separated list such as 2500,3000,3500 runs each in turn'
        required: true
        default: '1000'
      repeat_count:
        description: 'Times to repeat this run in sequence (use >1 with magnitude 0 for baseline noise characterisation)'
        required: true
        default: '1'

concurrency:
  group: prat-harness
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine target scenario
        id: target
        run: |
          case "${{ inputs.fault_profile }}" in
            Timing)  echo "category=Login" >> "$GITHUB_OUTPUT" ;;
            Latency) echo "category=Navigation" >> "$GITHUB_OUTPUT" ;;
            Retry)   echo "category=PasswordReset" >> "$GITHUB_OUTPUT" ;;
            Load)    echo "category=Documents" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Write environment config
        run: |
          cat <<EOF > ClientPortal.PRAT.Acceptance/appsettings.local.json
          {
            "Environments": {
              "REL": { "BaseUrl": "${{ secrets.REL_BASE_URL }}" }
            }
          }
          EOF

      - name: Write test credentials
        run: |
          cat <<EOF > ClientPortal.PRAT.Acceptance/credentials.local.json
          {
            "Accounts": {
              "goodLogin": { "Email": "${{ secrets.REL_GOOD_EMAIL }}", "Password": "${{ secrets.REL_GOOD_PASSWORD }}" },
              "badLogin": { "Email": "${{ secrets.REL_BAD_EMAIL }}", "Password": "${{ secrets.REL_BAD_PASSWORD }}" },
              "invalidLogin": { "Email": "${{ secrets.REL_INVALID_EMAIL }}", "Password": "${{ secrets.REL_INVALID_PASSWORD }}" },
              "resetLogin": { "Email": "${{ secrets.REL_RESET_EMAIL }}" }
            }
          }
          EOF

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Install Playwright browsers
        run: pwsh ClientPortal.PRAT.Acceptance/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run harness (repeated)
        if: always()
        env:
          ENVIRON: REL
          FAULT_PROFILE: ${{ inputs.fault_profile }}
          FAULT_MAGNITUDES: ${{ inputs.fault_magnitude }}
          TARGET_CATEGORY: ${{ steps.target.outputs.category }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # This step runs under bash -e, and dotnet test exits non-zero
          # whenever any test fails. Without handling that, the loop would
          # stop at the first iteration containing a failure and discard
          # its results, which are exactly the data the harness exists to
          # collect. So: record the exit code, carry on, and report it at
          # the end so the run still shows red if any iteration failed.
          test_rc=0

          # fault_magnitude may be one value or a comma-separated list
          # (for example 2500,3000,3500). Each magnitude is run in turn
          # with the full repeat count.
          magnitudes="${FAULT_MAGNITUDES// /}"
          magnitudes="${magnitudes//,/ }"

          for mag in $magnitudes; do
            export FAULT_MAGNITUDE="$mag"

            for i in $(seq 1 ${{ inputs.repeat_count }}); do
              echo "=== Magnitude $mag, iteration $i of ${{ inputs.repeat_count }} ==="

              dotnet test ClientPortal.PRAT.Acceptance \
                --no-build \
                --filter "Category=$TARGET_CATEGORY" \
                --logger "trx;LogFileName=harness-results.trx" || test_rc=$?

              export ITERATION=$i
              export RAN_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)

              python3 - <<'PYEOF'
          import csv, json, os, re
          import xml.etree.ElementTree as ET

          trx_path = 'ClientPortal.PRAT.Acceptance/TestResults/harness-results.trx'
          dataset_path = 'data/harness-results.csv'

          if not os.path.isfile(trx_path):
              print('No trx found, skipping append for this iteration.')
              raise SystemExit(0)

          def parse_duration(d):
              h, m, s = d.split(':')
              return round(int(h) * 3600 + int(m) * 60 + float(s), 3)

          GHERKIN = re.compile(r'^(Given|When|Then|And|But) ')
          DURATION = re.compile(r'\((\d+(?:\.\d+)?)s\)')

          def step_seconds(stdout):
              """Per-step timings as 'Keyword=seconds;Keyword=seconds', in order.

              Read from the test's standard output, which the trx keeps for
              passing and failing tests alike. Skipped steps are omitted. For a
              step that errored, the value is the time until it failed.
              """
              out, keyword, block = [], None, None
              for raw in (stdout or '').splitlines():
                  line = raw.strip()
                  if block is None:
                      if line.startswith('STEP START:'):
                          block = []
                      elif GHERKIN.match(line):
                          keyword = line.split(' ', 1)[0]
                  elif line.startswith('STEP END:'):
                      found = DURATION.findall(' '.join(block))
                      if found and keyword:
                          out.append(f'{keyword}={found[-1]}')
                      block = None
                  else:
                      block.append(line)
              return ';'.join(out)

          def failed_step_of(stdout):
              """Gherkin text of the step that errored, or an empty string."""
              current, block = '', None
              for raw in (stdout or '').splitlines():
                  line = raw.strip()
                  if block is None:
                      if line.startswith('STEP START:'):
                          block = []
                      elif GHERKIN.match(line):
                          current = line
                  elif line.startswith('STEP END:'):
                      if any(b.startswith('-> error:') for b in block):
                          return current
                      block = None
                  else:
                      block.append(line)
              return ''

          def network_events_of(stdout):
              """Up to three failed network requests, e.g. 'POST ***/api/x - net::ERR_FAILED'."""
              events = [
                  l.strip().replace('[RequestFailed] ', '')
                  for l in (stdout or '').splitlines()
                  if l.strip().startswith('[RequestFailed]')
              ]
              return ' | '.join(events[:3])

          # The trx holds the real REL address, which is a secret: GitHub masks it
          # in logs but not in files. This repository is public, so failure text
          # is cleaned before it is stored. Two layers: the configured host is
          # removed wherever it appears, and any other URL host is masked too.
          def known_hosts():
              hosts = set()
              try:
                  with open('ClientPortal.PRAT.Acceptance/appsettings.local.json') as f:
                      cfg = json.load(f)
                  for env in cfg.get('Environments', {}).values():
                      url = env.get('BaseUrl', '')
                      if url:
                          hosts.add(url.rstrip('/'))
                          hosts.add(re.sub(r'^https?://', '', url).split('/')[0])
              except Exception:
                  pass
              return sorted((h for h in hosts if h), key=len, reverse=True)

          KNOWN_HOSTS = known_hosts()
          HOST_RE = re.compile(r'https?://[^/\s\'"<>]+')
          EMAIL_RE = re.compile(r'[\w.+-]+@[\w-]+(?:\.[\w-]+)+')

          def clean(text, limit):
              """One line, secrets and addresses masked, then truncated."""
              text = re.sub(r'\s+', ' ', text or '').strip()
              for host in KNOWN_HOSTS:
                  text = text.replace(host, '***')
              text = HOST_RE.sub('***', text)
              text = EMAIL_RE.sub('<email>', text)
              return text[:limit]

          ns = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          root = ET.parse(trx_path).getroot()

          def stdout_of(ut):
              node = ut.find(ns + 'Output/' + ns + 'StdOut')
              return node.text if node is not None and node.text else ''

          def message_of(ut):
              node = ut.find(ns + 'Output/' + ns + 'ErrorInfo/' + ns + 'Message')
              return node.text if node is not None and node.text else ''

          rows = [{
              'run_id': os.environ['RUN_ID'],
              'run_url': os.environ['RUN_URL'],
              'ran_at_utc': os.environ['RAN_AT_UTC'],
              'commit_sha': os.environ['COMMIT_SHA'],
              'fault_profile': os.environ['FAULT_PROFILE'],
              'fault_magnitude': os.environ['FAULT_MAGNITUDE'],
              'target_category': os.environ['TARGET_CATEGORY'],
              'iteration': os.environ['ITERATION'],
              'scenario_name': ut.get('testName'),
              'outcome': ut.get('outcome'),
              'duration_seconds': parse_duration(ut.get('duration')),
              'step_seconds': step_seconds(stdout_of(ut)),
              'error_message': clean(message_of(ut), 400),
              'failed_step': clean(failed_step_of(stdout_of(ut)), 200),
              'network_events': clean(network_events_of(stdout_of(ut)), 300),
          } for ut in root.iter(ns + 'UnitTestResult')]

          if not rows:
              print('trx contained no results, skipping append for this iteration.')
              raise SystemExit(0)

          os.makedirs('data', exist_ok=True)
          file_exists = os.path.isfile(dataset_path)

          expected_fields = list(rows[0].keys())
          if file_exists:
              with open(dataset_path, 'rb') as f:
                  content = f.read()

              # Guard 1: header must match the current schema, or refuse
              # rather than silently append mismatched columns.
              with open(dataset_path, newline='') as f:
                  existing_header = next(csv.reader(f), [])
              if existing_header and existing_header != expected_fields:
                  raise SystemExit(
                      'Refusing to append: existing header does not match '
                      f'the current schema.\nExisting: {existing_header}\n'
                      f'Current:  {expected_fields}\n'
                      'The dataset needs a one-time migration before this '
                      'can append safely, see docs/harness-design.md.'
                  )

              # Guard 2: file must end with a newline, or the next row
              # written in append mode will fuse onto the last line
              # instead of starting a fresh one.
              if content and not content.endswith(b'\n'):
                  print('Existing file has no trailing newline, adding one before appending.')
                  with open(dataset_path, 'ab') as f:
                      f.write(b'\r\n')

          with open(dataset_path, 'a', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=rows[0].keys())
              if not file_exists:
                  writer.writeheader()
              writer.writerows(rows)

          print(f'Appended {len(rows)} row(s) from magnitude {os.environ["FAULT_MAGNITUDE"]}, iteration {os.environ["ITERATION"]} to {dataset_path}')
          PYEOF

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add data/harness-results.csv
              if ! git diff --staged --quiet; then
                git commit -m "Append harness run ${{ github.run_id }} magnitude $mag iteration $i (${{ inputs.fault_profile }})"
                # A failed pull or push is not fatal: the commit stays local
                # and the next iteration's push carries it along.
                git pull --rebase --autostash || { git rebase --abort 2>/dev/null; echo "Pull failed, will retry next iteration."; }
                git push || echo "Push failed, will retry next iteration."
              fi
            done
          done

          # Final attempt in case the last iteration's push was rejected.
          git push || echo "Final push failed: some local commits were not pushed."

          # Report the test result now that every iteration has been captured.
          exit "$test_rc"

      - name: Upload results (final iteration only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-results-${{ inputs.fault_profile }}-${{ github.run_id }}
          path: ClientPortal.PRAT.Acceptance/TestResults/harness-results.trx